# 서명된 안드로이드 앱을 만들어 폰으로 보낸다. 두 갈래 — tool/release_plan.dart 가 정한다 (AGENTS.md "릴리스와 패치"):
#   · 릴리스 = 새 APK 를 릴리스 `apk-latest` 에 올리고, 같은 빌드를 Shorebird 에 등록한다 (그 뒤 패치가 얹힐 바탕)
#   · 패치   = 다트 코드(lib/)만 바뀌었을 때. Shorebird 코드 푸시로 보내고 새 APK 는 만들지 않는다 (version.json 의 patch 칸만)
# main 이 아닌 가지(시험 빌드)는 --dry-run: APK artifact 만 만들고 Shorebird · apk-latest 어디에도 올리지 않는다.
# 필요한 Actions 비밀값: ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD (키는 저장소 밖에 보관) · SHOREBIRD_TOKEN (Shorebird API 키)
name: Android APK

on:
  push:
    branches: [main]
    paths: ['lib/**', 'android/**', 'assets/**', 'config/**', 'pubspec.yaml', 'pubspec.lock', 'shorebird.yaml', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      release:
        description: '새 APK 로 내기 (다트 코드만 바뀌었어도)'
        type: boolean
        default: false

permissions:
  contents: write

# 가지마다 따로 — 시험 빌드가 main 의 릴리스를 끊지 않게. 같은 가지에서는 새 푸시가 앞 빌드를 끊는다
# (끊긴 빌드가 Shorebird 에 남긴 것은 쓰이지 않는다: 다음 빌드는 version.json 에 적힌 릴리스만 본다)
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # 검사에 쓰는 Flutter = 릴리스를 빌드하는 Flutter (Shorebird 가 같은 버전의 자기 Flutter 로 만든다, `shorebird flutter versions list`).
  # 패치는 얹힐 릴리스의 버전을 따라가므로, 이 값을 바꾸면 새 릴리스부터 적용된다 (이 파일이 바뀌면 릴리스가 된다).
  APP_FLUTTER: '3.47.4'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 바뀐 점 · 릴리스냐 패치냐 = 지난 빌드 커밋부터 지금까지

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.APP_FLUTTER }}
          channel: stable
          cache: true

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 비밀값이 없습니다. 디버그 키로 만들면 나중에 덮어 설치가 안 되므로 멈춥니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=hobbyatlas"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Shorebird 로그인 키 확인
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # 값은 찍지 않는다 — 있는지만 본다. 없으면 15분 빌드한 뒤가 아니라 여기서 멈춘다
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::SHOREBIRD_TOKEN 비밀값이 없습니다. Shorebird 콘솔 Account → API Keys 에서 만들어 넣으세요 (AGENTS.md \"릴리스와 패치\")."
            exit 1
          fi

      - run: flutter pub get

      - name: 검사
        run: |
          dart analyze lib test tool
          flutter test

      - name: 릴리스냐 패치냐
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.release }}
        run: |
          # 지난 빌드 = 릴리스 apk-latest 의 version.json (없으면 처음 → 릴리스)
          # 잠깐 못 받은 것 때문에 패치가 새 APK 로 바뀌지 않게 세 번까지 — 끝내 못 받으면 릴리스 (안전한 쪽)
          for i in 1 2 3; do
            if gh release download apk-latest -p version.json -O prev.json 2>/dev/null; then break; fi
            rm -f prev.json
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          if [ ! -s prev.json ]; then echo '{}' > prev.json; fi
          flag=""
          if [ "$FORCE_RELEASE" = "true" ]; then flag="--release"; fi
          set -o pipefail
          dart tool/release_plan.dart plan --last prev.json --ref "$GITHUB_REF" $flag | tee -a "$GITHUB_OUTPUT"

      - name: 바뀐 점
        if: steps.plan.outputs.mode != 'none'
        env:
          NOTES_FROM: ${{ steps.plan.outputs.notes_from }}
        run: |
          # 지난 빌드(릴리스든 패치든)의 커밋 → 그 뒤 커밋 제목 = 바뀐 점
          # --no-merges: "Merge branch …" 줄이 head -8 을 채워 진짜 바뀐 점이 밀려났다 (build 42 · 43, 2026-11-10)
          if [ -n "$NOTES_FROM" ]; then range="$NOTES_FROM..HEAD"; else range="-5"; fi
          git log --no-merges --format=%s $range -- lib android assets pubspec.yaml | sed -e 's/^v3: //' -e 's/ — .*//' | head -8 > notes.txt
          # 중국어 화면의 바뀐 점 = 같은 커밋들 본문의 "zh: …" 줄 (없으면 빈 목록 → 앱이 중국어 화면에서 칸을 숨긴다)
          git log --no-merges --format=%B $range -- lib android assets pubspec.yaml | tr -d '\r' | sed -n -E 's/^zh:[[:space:]]*//p' | head -8 > notes_zh.txt
          cat notes.txt notes_zh.txt

      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.plan.outputs.mode != 'none'
        with:
          cache: true

      - name: 패치 (Shorebird 코드 푸시)
        id: patch
        # main 만 — 계획(tool/release_plan.dart)이 틀려도 시험 가지에서는 패치가 나가지 않게 여기서도 막는다
        if: steps.plan.outputs.mode == 'patch' && github.ref == 'refs/heads/main'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          REL: ${{ steps.plan.outputs.release_version }}
          REL_NAME: ${{ steps.plan.outputs.release_name }}
          REL_BUILD: ${{ steps.plan.outputs.release_build }}
        run: |
          # 패치는 얹힐 릴리스와 같은 버전 · dart-define · 플래그로 만들어야 한다 (다르면 Shorebird 가 멈춘다, exit 64)
          set -o pipefail
          code=0
          shorebird patch android --release-version="$REL" --track=stable --no-tree-shake-icons \
            --build-name="$REL_NAME" --build-number="$REL_BUILD" \
            --dart-define=APP_BUILD="$REL_BUILD" --dart-define=APP_VERSION="$REL_NAME" 2>&1 | tee patch.log || code=$?
          if [ "$code" -ne 0 ]; then
            # 네이티브 코드 · 자산이 릴리스와 달라졌거나(exit 70 "Not publishing") 얹힐 릴리스가 Shorebird 에 없다
            # → 패치로는 못 보낸다. 멈춰 두면 변경이 폰에 안 가므로 같은 실행에서 새 APK 로 낸다 (아래 릴리스 단계)
            why=$(grep -m1 -E 'Not publishing|Release not found|releases found for app|is incomplete|has no Android build' patch.log || true)
            if [ -n "$why" ]; then
              echo "::warning::패치로 보낼 수 없어 새 APK 로 냅니다 — $why"
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::shorebird patch 가 실패했습니다 (exit $code). SHOREBIRD_TOKEN 이 만료됐는지, 위 로그를 확인하세요."
            exit "$code"
          fi
          number=$(grep -m1 -oE 'Published Patch [0-9]+' patch.log | grep -oE '[0-9]+' || true)
          if [ -z "$number" ]; then
            echo "::error::패치 번호를 읽지 못했습니다 (\"Published Patch n!\" 줄이 없음)"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: 릴리스 (새 APK + Shorebird 등록)
        id: release
        if: steps.plan.outputs.mode == 'release' || steps.patch.outputs.fallback == 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          DRY_RUN: ${{ steps.plan.outputs.dry_run }}
        run: |
          # arm64 만 (요즘 폰 전부 — Shorebird 는 --target-platform 으로 정한다). APP_BUILD = 앱이 자기 빌드 번호를 안다 (업데이트 확인)
          # 버전 이름 = pubspec 앞 두 자리 + 빌드 번호 (1.1.6) — 설정 › 버전 · 업데이트 시트에 보인다. Shorebird 릴리스 이름 = 1.1.6+6
          # --no-tree-shake-icons: 아이콘 글꼴을 통째로 넣는다 (+약 2 MB). 줄여 넣으면 패치가 새 아이콘을 쓸 때마다
          #   글꼴 파일(자산)이 달라져 패치로 못 보내고 새 APK 가 된다
          # --dry-run (시험 가지): 빌드 · 검사만 하고 Shorebird 에 올리지 않는다.
          #   계획의 dry_run 과 따로 가지 이름도 본다 — main 이 아니면 계획이 뭐라 하든 올리지 않는다
          mm=$(sed -nE 's/^version: *([0-9]+\.[0-9]+)\..*/\1/p' pubspec.yaml)
          name="$mm.${{ github.run_number }}"
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"
          dry=""
          if [ "$DRY_RUN" = "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then dry="--dry-run"; fi
          shorebird release android --artifact apk --target-platform android-arm64 \
            --flutter-version="$APP_FLUTTER" --no-tree-shake-icons \
            --build-name="$name" --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_VERSION="$name" $dry || {
            code=$?
            echo "::error::shorebird release 가 실패했습니다 (exit $code). SHOREBIRD_TOKEN 만료 · Shorebird 장애 · \"다시 실행\"(이미 있는 버전)인지 위 로그를 확인하세요 (AGENTS.md \"릴리스와 패치\")."
            exit "$code"
          }
          cp build/app/outputs/flutter-apk/app-release.apk hobby-atlas.apk

      - name: APK 확인
        # Shorebird CLI 는 버전을 고정하지 않는다(늘 최신) → 빌드 방식이 달라져도 잘못된 APK 가 폰에 가지 않게 올리기 전에 본다
        if: steps.release.conclusion == 'success'
        run: |
          unzip -Z1 hobby-atlas.apk > apk-files.txt
          echo "크기 $(stat -c %s hobby-atlas.apk) · 네이티브 라이브러리 $(grep -E '^lib/' apk-files.txt | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          if grep -E '^lib/' apk-files.txt | grep -qv '^lib/arm64-v8a/'; then
            echo "::warning::arm64 가 아닌 네이티브 라이브러리가 들어갔습니다 (APK 가 40 MB 쯤 커진다 — android/app/build.gradle.kts packaging)"
          fi
          # Shorebird 설정이 없는 APK 는 패치를 받지 못한다 — version.json 은 패치가 나갔다고 하는데 폰은 그대로가 된다
          if ! grep -qx 'assets/flutter_assets/shorebird.yaml' apk-files.txt; then
            echo "::error::APK 에 shorebird.yaml 이 없습니다 — 패치를 받지 못하는 빌드"
            exit 1
          fi
          # 디버그 키로 서명된 APK 는 깔린 앱 위에 덮어 설치되지 않는다. 인증서 이름(DN)은 찍지 않고 지문만
          apksigner=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner 가 없어 서명을 확인하지 못했습니다"
            exit 0
          fi
          certs=$("$apksigner" verify --print-certs hobby-atlas.apk) || { echo "::error::APK 서명을 확인하지 못했습니다"; exit 1; }
          echo "$certs" | grep 'certificate SHA-256' || true
          if ! echo "$certs" | grep -q 'certificate SHA-256' || echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::APK 가 릴리스 키로 서명되지 않았습니다"
            exit 1
          fi

      - name: version.json (앱 업데이트 확인용)
        # 만들기만 한다 (시험 빌드에서도 — 처음 main 에서 돌 때 깨지지 않게). 올리는 것은 아래 단계, main 만
        if: steps.release.conclusion == 'success'
        run: |
          # 마지막 커밋 제목(첫 줄)에 [minor] 가 있으면 묻지 않고 ⬇ 아이콘만
          major=true
          if git log -1 --format=%s | grep -q '\[minor\]'; then major=false; fi
          dart tool/release_plan.dart release-json --build ${{ github.run_number }} --version "$APP_VERSION" --sha "$GITHUB_SHA" \
            --major $major --apk hobby-atlas.apk --notes notes.txt --notes-zh notes_zh.txt > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        if: steps.release.conclusion == 'success'
        with:
          name: hobby-atlas-apk
          path: hobby-atlas.apk

      - name: 릴리스 apk-latest 에 올리기
        # main 만 사람들 폰에 간다. 다른 가지는 빌드 확인 + artifact 만
        if: steps.release.conclusion == 'success' && github.ref == 'refs/heads/main' && steps.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="커밋 ${GITHUB_SHA::7} · 빌드 ${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%MZ)"
          # APK 를 다 올린 뒤에 version.json — 한 명령으로 같이 올리면 version.json 이 2–3초 먼저 바뀌어
          # 그 사이 확인한 폰이 새 sha256 으로 옛 APK 를 받아 검사에서 떨어진다 (build 42 · 43, 2026-11-10)
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest hobby-atlas.apk --clobber
          else
            gh release create apk-latest hobby-atlas.apk --title "Hobby Atlas (최신 APK)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload apk-latest version.json --clobber
          gh release edit apk-latest --notes "$notes" --target "$GITHUB_SHA"

      - name: version.json 에 패치 적기
        # APK 쪽 칸(build · sha256 …)은 그대로 두고 patch 칸만 — 그 APK 를 쓰는 폰에 "새 APK" 알림이 뜨지 않게
        if: steps.patch.outputs.number != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart tool/release_plan.dart patch-json --last prev.json --number ${{ steps.patch.outputs.number }} --sha "$GITHUB_SHA" \
            --notes notes.txt --notes-zh notes_zh.txt > version.json
          cat version.json
          gh release upload apk-latest version.json --clobber

      - name: 만들 것이 없음
        if: steps.plan.outputs.mode == 'none'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::notice::$REASON — APK 도 패치도 만들지 않았습니다. 새 APK 가 필요하면 수동 실행에서 release 를 켜세요."

      - name: 키 지우기
        if: always()
        run: rm -f android/app/release.jks android/key.properties
