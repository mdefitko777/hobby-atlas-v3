# 서명된 안드로이드 APK 를 만들어 릴리스 `apk-latest` 에 올린다.
# 필요한 Actions 비밀값: ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD (키는 저장소 밖에 보관)
name: Android APK

on:
  push:
    branches: [main]
    paths: ['lib/**', 'android/**', 'assets/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 바뀐 점 = 지난 빌드 커밋부터 지금까지

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 비밀값이 없습니다. 디버그 키로 만들면 나중에 덮어 설치가 안 되므로 멈춥니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=hobbyatlas"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: 검사
        run: |
          dart analyze lib test tool
          flutter test

      - name: APK
        run: |
          # arm64 만 (요즘 폰 전부 · 76 MB → 약 40 MB). APP_BUILD = 앱이 자기 빌드 번호를 안다 (업데이트 확인)
          # 버전 이름 = pubspec 앞 두 자리 + 빌드 번호 (1.1.6) — 설정 › 버전 · 업데이트 시트에 보인다
          mm=$(sed -nE 's/^version: *([0-9]+\.[0-9]+)\..*/\1/p' pubspec.yaml)
          name="$mm.${{ github.run_number }}"
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"
          flutter build apk --release --target-platform android-arm64 \
            --build-name=$name --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_VERSION=$name
          cp build/app/outputs/flutter-apk/app-release.apk hobby-atlas.apk

      - name: version.json (앱 업데이트 확인용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 지난 빌드의 커밋 → 그 뒤 커밋 제목 = 바뀐 점. 마지막 커밋 제목(첫 줄)에 [minor] 가 있으면 묻지 않고 ⬇ 아이콘만
          gh release download apk-latest -p version.json -O prev.json 2>/dev/null || echo '{}' > prev.json
          prev=$(jq -r '.sha // empty' prev.json)
          if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then range="$prev..HEAD"; else range="-5"; fi
          git log --format=%s $range -- lib android assets pubspec.yaml | sed -e 's/^v3: //' -e 's/ — .*//' | head -8 > notes.txt
          major=true
          if git log -1 --format=%s | grep -q '\[minor\]'; then major=false; fi
          jq -n --argjson build ${{ github.run_number }} --arg version "$APP_VERSION" --arg sha "$GITHUB_SHA" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson major $major \
            --arg sha256 "$(sha256sum hobby-atlas.apk | cut -d' ' -f1)" --argjson size $(stat -c %s hobby-atlas.apk) \
            --rawfile notes notes.txt \
            '{build:$build, version:$version, sha:$sha, built_at:$built, major:$major, apk:"hobby-atlas.apk", sha256:$sha256, size:$size,
              notes:($notes | split("\n") | map(select(length > 0)))}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: hobby-atlas-apk
          path: hobby-atlas.apk

      - name: 릴리스 apk-latest 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="커밋 ${GITHUB_SHA::7} · 빌드 ${{ github.run_number }} · $(date -u +%Y-%m-%dT%H:%MZ)"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest hobby-atlas.apk version.json --clobber
            gh release edit apk-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create apk-latest hobby-atlas.apk version.json --title "Hobby Atlas (최신 APK)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi

      - name: 키 지우기
        if: always()
        run: rm -f android/app/release.jks android/key.properties
